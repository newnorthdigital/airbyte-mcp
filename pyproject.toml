[project]
name = "airbyte-mcp"
version = "0.1.0"
description = "MCP server for managing Airbyte workspaces, sources, destinations, connections, and syncs"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "airbyte-api>=0.53.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
